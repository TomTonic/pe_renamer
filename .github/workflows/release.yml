name: Build and upload release binaries

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            osname: windows_x64
          - goos: linux
            goarch: amd64
            ext: ""
            osname: linux_x64
          - goos: darwin
            goarch: arm64
            ext: ""
            osname: macos_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist
          mkdir -p dist/${{ matrix.osname }}
          # Build with deterministic binary name: pe_renamer (pe_renamer.exe on Windows)
          BIN=pe_renamer
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN=${BIN}.exe
          fi
          echo "Building $BIN (GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }})"
          LDFLAGS="-s -w -X main.gitTag=${{ github.ref_name }} -X main.buildOS=${{ matrix.goos }} -X main.buildArch=${{ matrix.goarch }}"
          echo "ldflags: $LDFLAGS"
          go build -ldflags "$LDFLAGS" -o dist/${{ matrix.osname }}/${BIN} .

      - name: Zip binary (named per OS + tag) and create checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist/${{ matrix.osname }}
          BIN=pe_renamer
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN=${BIN}.exe
          fi
          # sanitize tag for filenames (replace unsafe chars with '-')
          SAN_TAG=$(echo "$TAG" | sed 's#[^A-Za-z0-9._-]#-#g')
          ZIPNAME=pe_renamer_${SAN_TAG}_${{ matrix.osname }}.zip
          if [ ! -f "$BIN" ]; then
            echo "Built binary $BIN not found in dist/${{ matrix.osname }}" >&2
            ls -la
            exit 1
          fi
          zip -j "../$ZIPNAME" "$BIN"
          # create sha256 checksum next to the zip (hex only)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "../$ZIPNAME" | awk '{print $1}' > "../$ZIPNAME.sha256"
          else
            shasum -a 256 "../$ZIPNAME" | awk '{print $1}' > "../$ZIPNAME.sha256"
          fi

      - name: Upload artifact (zip + sha256)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.osname }}
          path: |
            dist/pe_renamer_*_${{ matrix.osname }}.zip
            dist/pe_renamer_*_${{ matrix.osname }}.zip.sha256

  publish:
    permissions:
      contents: write  # for softprops/action-gh-release to create GitHub release
    name: Attach artifacts to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: List downloaded artifacts
        run: ls -la dist

      - name: Flatten artifacts into dist/
        # Downloaded artifacts are placed under dist/<artifact-name>/...;
        # move the inner files up so the release uploader sees dist/pe_renamer_TAG_OSNAME.zip
        run: |
          set -euo pipefail
          shopt -s dotglob || true
          # Move any files from artifact subdirs into dist/
          for sub in dist/dist-*; do
            if [ -d "$sub" ]; then
              mv -v "$sub"/* dist/ || true
            fi
          done
          # show final layout
          ls -la dist

      - name: Upload release assets
        # softprops/action-gh-release creates/updates the GitHub Release and uploads files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
